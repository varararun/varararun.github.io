<section>
    <div class="content">
        <div class="title" data-aos="fade-up">
            <h3 class="section-title">
                {{"Highlights.Title" | translate}}
            </h3>
        </div>
        <div>
            <ul class="highlight-categories">
                <li data-aos="fade-up" data-aos-duration="500"
                    (click)="scrollTo('qualifications')" [class.active]="selectedSection === 'qualifications'">
                    Qualifications
                </li>
                <li data-aos="fade-up" data-aos-duration="500" data-aos-delay="100"
                    (click)="scrollTo('skills')" [class.active]="selectedSection === 'skills'">
                    Skills
                </li>
            </ul>
            <div id="carousel">
                <div id="qualifications" class="carousel-item" (click)="scrollTo('skills')">
                    <ul class="qualifications-list" data-aos="fade-up">
                        <li *ngFor="let text of 'Highlights.Qualifications' | translate; let i = index"
                            [innerHTML]="text"
                            class="qualifications-element bullet"
                            data-aos="fade-up" data-aos-duration="500" data-aos-offset="-50"
                            [attr.data-aos-delay]="i*50">
                        </li>
                    </ul>
                </div>
                <div id="skills" class="carousel-item" (click)="scrollTo('qualifications')">
                    <div *ngFor="let skill of 'Highlights.Skills' | translate; let i = index" class="skills"
                         data-aos="fade-up" data-aos-duration="500" data-aos-offset="-50" [attr.data-aos-delay]="i*50">
                        <div><b>{{skill['Category']}}</b></div>
                        <span *ngFor="let s of skill['Elements']" class="skill-element">
                        <span class="highlight">{{s}}</span>
                      </span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
