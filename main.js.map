<div class="terminal-container">
    <div class="terminal-menu">
        <div class="terminal-buttons">
            <a routerLink="home">
                <div class="terminal-button terminal-button-red"></div>
            </a>
            <div class="terminal-button terminal-button-yellow"></div>
            <div class="terminal-button terminal-button-green"></div>
        </div>
        <div class="terminal-title">
            <a href="https://github.com/vararun" target="_blank"><i class='fab fa-github'></i> ~/arun-varghese -avsh</a>
        </div>
    </div>
    <div id="terminal">
        <li *ngFor="let line of lines; let i = index" [innerHTML]="line"></li>
        <li *ngIf="waitForInput">$ <input class="terminal-input"></li>
    </div>
</div>
